<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/style.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cookie&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>    
<script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script> 
<title>AI Poem Generator</title>
  </head>


  <body>

    <div class="container">
    <header>
      <h1>AI Poem Generator</h1>
    </header>

  <main>
    <div class="form-container">
    <form id="poem-generator-form">
      <input type="text" placeholder="Enter poem's topic or instructions" autofocus required autocomplete="off" class="instructions" id="user-instructions" />
      <input type="submit" class="submit-button" value="Generate Poem"/>
    </form>
      <div class="hint"> i.e: Your first name, Sleep or Dog  </div>
    </div>
      <div class="poem hidden" id="poem">
    </div>
  
     </main>
    <footer> This AI project was coded by <a href="https://github.com/natachaflemoine" target=_blank>Natacha Fanini-Lemoine</a> and is <a href="https://github.com/natachaflemoine/poem-generator" target="_blank">open-sourced on GitHub</a> and <a href="https://ai-shecodes-poem-generator.netlify.app/" target="_blank">hosted on Netlify</a></footer>
    </div>

    <script src="src/index.js"></script> 
  </body>


</html>
